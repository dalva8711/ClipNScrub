name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Archive macOS app (preserve executable permissions)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/bundle/macos/ClipNScrub.app ClipNScrub-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNScrub-${{ matrix.target }}-unsigned
          if-no-files-found: error
          path: |
            ClipNScrub-*.zip
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
